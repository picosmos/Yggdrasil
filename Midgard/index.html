<!DOCTYPE html>
<html lang="en">
<!-- cspell: ignore ownername colour hsluv -->

<head>
    <meta charset="UTF-8">
    <title>Miðgarðr</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./node_modules/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="./styles/styles.css" />
    <script type="module" src="./scripts/app.js"></script>
    <script src="./node_modules/alpinejs/dist/cdn.min.js" defer></script>
    <script src="./node_modules/leaflet/dist/leaflet.js" defer></script>
    <script src="./node_modules/papaparse/papaparse.min.js" defer></script>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
</head>

<body x-data="app()" x-init="init()">
    <div class="app-layout">
        <aside class="settings" :class="{ 'is-open': menuOpen, 'settings-no-animate': !hasInitializedMenu }">
            <div class="settings-content">
                <h1>Miðgarðr</h1>

                <h2>Tracks</h2>
                <div class="settings-section">
                    <div style="display: flex; gap: 8px; margin-bottom: 18px;">
                        <input type="text" x-model="pendingId" placeholder="Enter track id" @keyup.enter="applyId" style="flex: 1; border: 1px solid rgba(15, 23, 42, 0.15); border-radius: 6px; padding: 8px 10px; font-size: 0.95rem;" />
                        <button class="primary" type="button" @click="applyId">Add</button>
                    </div>

                    <div class="field">
                        <template x-for="item in state.ids" :key="typeof item === 'string' ? item : item.id">
                            <div class="track-item">
                                <div class="track-item-header">
                                    <label class="field checkbox track-item-checkbox">
                                        <input type="checkbox"
                                            :checked="trackSettings[typeof item === 'string' ? item : item.id]?.enabled"
                                            @change="toggleTrack(typeof item === 'string' ? item : item.id)">
                                        <span x-text="typeof item === 'string' ? item : item.id"></span>
                                    </label>
                                    <button class="track-item-delete" type="button"
                                        @click="deleteTrack(typeof item === 'string' ? item : item.id)"
                                        title="Delete track">
                                        ×
                                    </button>
                                </div>

                                <div class="track-item-settings"
                                    :class="{ 'track-item-settings-disabled': !trackSettings[typeof item === 'string' ? item : item.id]?.enabled }"
                                    x-data="{ trackId: typeof item === 'string' ? item : item.id }">

                                    <div class="field field-nested">
                                        <span class="field-sub-label">Colour mode</span>

                                        <div class="radio-group radio-group-stacked">
                                            <label class="radio-option">
                                                <input type="radio" :name="'colorMode-' + trackId"
                                                    :checked="!trackSettings[trackId]?.colorEnabled"
                                                    @change="setTrackColorMode(trackId, false)"
                                                    :disabled="!trackSettings[trackId]?.enabled">
                                                <span>Single colour</span>
                                            </label>

                                            <!-- Base color picker - always shown, greyed when not in single colour mode -->
                                            <div class="radio-option-content"
                                                :class="{ 'field-disabled': trackSettings[trackId]?.colorEnabled || !trackSettings[trackId]?.enabled }">
                                                <div class="color-picker-field">
                                                    <label class="color-picker-field-label">
                                                        <span>Base colour</span>
                                                        <input class="color-picker-field-input" type="color"
                                                            x-model="trackSettings[trackId].color"
                                                            @input="updateTrackColor(trackId)"
                                                            :disabled="trackSettings[trackId]?.colorEnabled || !trackSettings[trackId]?.enabled"
                                                            title="Applies to every segment">
                                                    </label>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="radio-group radio-group-stacked">
                                            <label class="radio-option">
                                                <input type="radio" :name="'colorMode-' + trackId"
                                                    :checked="trackSettings[trackId]?.colorEnabled"
                                                    @change="setTrackColorMode(trackId, true)"
                                                    :disabled="!trackSettings[trackId]?.enabled">
                                                <span>Shenanigans</span>
                                            </label>

                                            <!-- Settings always shown, greyed when not in Shenanigans mode -->
                                            <div class="radio-option-content"
                                                :class="{ 'field-disabled': !trackSettings[trackId]?.colorEnabled || !trackSettings[trackId]?.enabled }">
                                                <label>
                                                    <span>New colour after</span>
                                                    <div class="slider-line">
                                                        <input type="range" :min="0" :max="breakHourOptions.length - 1"
                                                            :value="getTrackBreakHoursIndex(trackId)"
                                                            @input="setTrackBreakHours(trackId, $event.target.value)"
                                                            :disabled="!trackSettings[trackId]?.colorEnabled || !trackSettings[trackId]?.enabled" />
                                                        <output
                                                            x-text="formatBreakHours(trackSettings[trackId]?.breakHours || 3.0)"></output>
                                                    </div>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <hr />

                    <div class="field">
                        <label>
                            <span>Lighten segments with speed over</span>
                            <div class="slider-line">
                                <input type="range" :min="0" :max="speedCutoffOptions.length - 1"
                                    :value="speedCutoffIndex()" @input="setSpeedCutoff($event.target.value)" />
                                <output x-text="state.speedCutoff + 'km/h'"></output>
                            </div>
                        </label>
                    </div>

                    <div class="field">
                        <label>
                            <span>Hide segments longer than</span>
                            <div class="slider-line">
                                <input type="range" min="0" :max="segmentLengthSliderSteps"
                                    :value="segmentLengthSliderValue()"
                                    @input="setSegmentLengthLimit($event.target.value)" />
                                <output x-text="formatSegmentLength(state.segmentLengthLimitKm)"></output>
                            </div>
                        </label>
                    </div>

                    <hr />

                    <h2>Map Settings</h2>

                    <label class="field">
                        <span>Base map</span>
                        <select x-model="state.mapSource" @change="updateMapSource">
                            <template x-for="source in mapSources" :key="source.key">
                                <option :value="source.key" x-text="source.label"
                                    :selected="source.key === state.mapSource"></option>
                            </template>
                        </select>
                    </label>

                    <label class="field checkbox">
                        <input type="checkbox" :checked="state.showHuts" @change="setShowHuts($event.target.checked)">
                        <span>Show huts</span>
                    </label>

                    <button class="primary" type="button" @click="centerMap" 
                        :disabled="!state.ids || state.ids.filter(item => trackSettings[TrackUtils.getTrackId(item)]?.enabled).length === 0"
                        x-text="(() => {
                            const count = state.ids ? state.ids.filter(item => trackSettings[TrackUtils.getTrackId(item)]?.enabled).length : 0;
                            return count === 1 ? 'Center map to track' : 'Center map to tracks';
                        })()"></button>
                </div>

                <div class="settings-section settings-section-status" x-show="mapStatus">
                    <p class="map-status" x-text="mapStatus" role="status"></p>
                </div>
            </div>
        </aside>

        <main class="map-wrapper">
            <div id="map" x-ref="map" :class="{ 'map-modal-active': showMapStatusModal }"></div>

            <!-- Map Status Modal Dialog -->
            <div class="map-status-modal" x-show="showMapStatusModal" x-transition>
                <div class="map-status-modal-backdrop"></div>
                <div class="map-status-modal-dialog">
                    <img class="guillaume" src="./assets/guillaume.png" alt="Rubberduck" />
                    <p class="map-status-modal-message" x-text="mapStatus" role="status"></p>
                </div>
            </div>
        </main>

        <button class="menu-toggle" type="button" @click="toggleMenu" aria-label="Toggle settings">
            ☰
        </button>
    </div>
</body>

</html>
