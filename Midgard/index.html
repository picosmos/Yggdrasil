<!DOCTYPE html>
<html lang="en">
<!-- cspell: ignore ownername colour hsluv -->

<head>
    <meta charset="UTF-8">
    <title>Miðgarðr</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./node_modules/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="./styles/styles.css" />
    <script type="module" src="./scripts/app.js"></script>
    <script src="./node_modules/alpinejs/dist/cdn.min.js" defer></script>
    <script src="./node_modules/leaflet/dist/leaflet.js" defer></script>
    <script src="./node_modules/papaparse/papaparse.min.js" defer></script>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
</head>

<body x-data="app()" x-init="init()">
    <div class="app-layout">
        <aside class="settings" :class="{ 'is-open': menuOpen, 'settings--no-animate': !hasInitializedMenu }">
            <div class="settings__content">
                <h1>Miðgarðr</h1>
                <template x-if="!state.id">
                    <div class="settings__section">
                        <p>Who do you want to track?</p>
                        <label class="field">
                            <span>Track ID</span>
                            <input type="text" x-model="pendingId" placeholder="Enter track id" @keyup.enter="applyId" />
                        </label>
                        <button class="primary" type="button" @click="applyId">Load track</button>
                    </div>
                </template>

                <template x-if="state.id">
                    <div class="settings__section">
                        <label class="field">
                            <span>Track ID</span>
                            <input type="text" :value="state.id" readonly />
                        </label>

                        <hr />

                        <label class="field">
                            <span>Base map</span>
                            <select x-model="state.mapSource" @change="updateMapSource">
                                <template x-for="source in mapSources" :key="source.key">
                                    <option :value="source.key" x-text="source.label" :selected="source.key === state.mapSource"></option>
                                </template>
                            </select>
                        </label>

                        <hr />

                        <div class="field">
                            <div class="radio-group radio-group--stacked">
                                <label class="radio-option">
                                    <input type="radio" name="colorMode" :checked="!state.colorEnabled"
                                        @change="setColorMode(false)">
                                    <span>Single colour</span>
                                </label>
                            </div>
                        </div>

                        <div class="field field--nested color-picker-field"
                            :class="{ 'color-picker-field--inactive': state.colorEnabled }">
                            <label class="color-picker-field__label">
                                <span>Base colour</span>
                                <input class="color-picker-field__input" type="color" x-model="state.baseColor"
                                    @input="updateBaseColor" :disabled="state.colorEnabled"
                                    :title="state.colorEnabled ? 'Shenanigans cycles colours around this base colour' : 'Applies to every segment while Shenanigans is off'">
                            </label>
                        </div>

                        <div class="field">
                            <div class="radio-group radio-group--stacked">
                                <label class="radio-option">
                                    <input type="radio" name="colorMode" :checked="state.colorEnabled"
                                        @change="setColorMode(true)">
                                    <span>Shenanigans</span>
                                </label>
                            </div>
                        </div>

                        <div class="field field--nested" :class="{ 'field--disabled': !state.colorEnabled }">
                            <label>
                                <span>New colour after</span>
                                <div class="slider-line">
                                    <input type="range" :min="0" :max="breakHourOptions.length - 1"
                                        :value="breakHoursIndex()" @input="setBreakHours($event.target.value)"
                                        :disabled="!state.colorEnabled" />
                                    <output x-text="formatBreakHours(state.breakHours)"></output>
                                </div>
                            </label>
                        </div>

                        <hr />

                        <div class="field">
                            <label>
                                <span>Lighten segments with speed over</span>
                                <div class="slider-line">
                                    <input type="range" :min="0" :max="speedCutoffOptions.length - 1"
                                        :value="speedCutoffIndex()" @input="setSpeedCutoff($event.target.value)" />
                                    <output x-text="state.speedCutoff + 'km/h'"></output>
                                </div>
                            </label>
                        </div>

                        <div class="field">
                            <label>
                                <span>Hide segments longer than</span>
                                <div class="slider-line">
                                    <input type="range" min="0" :max="segmentLengthSliderSteps"
                                        :value="segmentLengthSliderValue()"
                                        @input="setSegmentLengthLimit($event.target.value)" />
                                    <output x-text="formatSegmentLength(state.segmentLengthLimitKm)"></output>
                                </div>
                            </label>
                        </div>

                        <hr />

                        <label class="field checkbox">
                            <input type="checkbox" :checked="state.showHuts"
                                @change="setShowHuts($event.target.checked)">
                            <span>Show huts</span>
                        </label>

                        <hr />

                        <button class="primary" type="button" @click="centerMap">Center map</button>
                    </div>
                </template>

                <div class="settings__section settings__section--status" x-show="mapStatus">
                    <p class="map-status" x-text="mapStatus" role="status"></p>
                </div>
            </div>
        </aside>

        <main class="map-wrapper">
            <div id="map" x-ref="map" :class="{ 'map--modal-active': showMapStatusModal }"></div>
            
            <!-- Map Status Modal Dialog -->
            <div class="map-status-modal" x-show="showMapStatusModal" x-transition>
                <div class="map-status-modal__backdrop"></div>
                <div class="map-status-modal__dialog">
                    <img class="guillaume" src="./assets/guillaume.png" alt="Rubberduck" />
                    <p class="map-status-modal__message" x-text="mapStatus" role="status"></p>
                </div>
            </div>
        </main>

        <button class="menu-toggle" type="button" @click="toggleMenu" aria-label="Toggle settings">
            ☰
        </button>
    </div>
</body>

</html>
